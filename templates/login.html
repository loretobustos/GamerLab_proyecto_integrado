{% extends 'base.html' %}
{% block content %}
<main>
  <div class="container" style="max-width:480px">
    <div class="card">
      <h2>Iniciar Sesión</h2>
      <p>Acceso institucional GamerLab · INACAP Sede Maipú.</p>
      {% if error %}<div class="notice warning" style="margin-bottom:14px">{{ error }}</div>{% endif %}
      <form method="POST" action="{% url 'login' %}" class="form-grid">
        {% csrf_token %}
        <div class="field full"><label>Usuario</label><input type="text" name="username" required></div>
        <div class="field full"><label>Contraseña</label><input type="password" name="password" required></div>
        <div class="field full"><button type="submit" class="btn btn-primary">Entrar</button></div>
      </form>
      <p style="margin-top:14px"><a href="{% url 'registro' %}" style="color:var(--primary-2)">¿No tienes cuenta? Regístrate aquí</a></p>
    </div>
  </div>
</main>
{% endblock %}
