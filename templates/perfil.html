{% if messages %}
  {% for message in messages %}
    <div id="alerta-perfil" style="
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      margin-bottom: 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      {% if message.tags == 'error' %}
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.4);
        color: #fca5a5;
      {% else %}
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.4);
        color: #6ee7b7;
      {% endif %}
    ">
      <span>{{ message }}</span>
      <button type="button" onclick="this.parentElement.style.display='none';" style="background: none; border: none; color: inherit; font-size: 18px; cursor: pointer; line-height: 1; padding-left: 12px;">
        &times;
      </button>
    </div>
  {% endfor %}
{% endif %}
