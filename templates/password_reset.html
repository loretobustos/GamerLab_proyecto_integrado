{% extends 'base.html' %}
{% block content %}
<main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 160px); padding: 40px 20px;">
  <div class="container" style="max-width: 480px; width: 100%;">
    <div class="card" style="background: rgba(22, 27, 34, 0.9); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: #fff;">
      <h2 style="margin-bottom: 8px; font-size: 26px; color: #818cf8;">Recuperar Contraseña</h2>
      <p style="color: #9aa6b8; margin-bottom: 20px; font-size: 14px;">Ingresa tu correo institucional (@inacapmail.cl) para restablecer el acceso a GamerLab.</p>
      
      <form method="POST" class="form-grid">
        {% csrf_token %}
        <div class="field full" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500;">Correo Institucional</label>
          <input type="email" name="email" required placeholder="nombre@inacapmail.cl" autofocus style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff;">
        </div>
        
        <div class="field full" style="margin-top: 10px;">
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Enviar enlace de recuperación</button>
        </div>
      </form>
      
      <p style="margin-top: 20px; text-align: center; font-size: 14px;">
        <a href="{% url 'login' %}" style="color: var(--primary-2, #818cf8); text-decoration: none;">Volver al inicio de sesión</a>
      </p>
    </div>
  </div>
</main>
{% endblock %}
