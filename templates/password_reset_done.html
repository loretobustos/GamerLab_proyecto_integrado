{% extends 'base.html' %}
{% block content %}
<main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 160px); padding: 40px 20px;">
  <div class="container" style="max-width: 480px; width: 100%;">
    <div class="card" style="background: rgba(22, 27, 34, 0.9); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: #fff; text-align: center;">
      <h2 style="margin-bottom: 12px; font-size: 26px; color: #34d399;">Correo Enviado</h2>
      <p style="color: #9aa6b8; margin-bottom: 25px; font-size: 14px; line-height: 1.5;">Hemos enviado las instrucciones a tu correo institucional para restablecer tu contraseña. Revisa tu bandeja de entrada o spam.</p>
      <a href="{% url 'login' %}" class="btn btn-primary" style="display: inline-block; padding: 12px 24px; background: #6366f1; color: #fff; border-radius: 6px; text-decoration: none; font-weight: bold;">Ir a Iniciar Sesión</a>
    </div>
  </div>
</main>
{% endblock %}
