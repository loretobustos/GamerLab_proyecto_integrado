{% extends 'base.html' %}
{% block content %}
<main style="padding: 40px 20px;">
  <div class="container" style="max-width:560px; margin: 0 auto;">
    <div class="card" style="background: rgba(22, 27, 34, 0.9); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: #fff;">
      <h2 style="margin-bottom: 10px; color: #818cf8;">Registro de Competidor</h2>
      <p style="color: #94a3b8; margin-bottom: 20px; font-size: 14px;">Crea tu cuenta institucional y perfil ELO para INACAP Sede Maipú.</p>
      
      {% if error %}
        <div style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'registro' %}" class="form-grid">
        {% csrf_token %}
        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Usuario</label>
          <input type="text" name="username" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff;">
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">RUN / RUT</label>
          <input type="text" name="run_identificador" required placeholder="12.345.678-9" pattern="^\d{1,2}\.\d{3}\.\d{3}-[0-9kK]$|^\d{7,8}-[0-9kK]$" title="Ingrese un RUN válido con guion (ej: 12345678-9)" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff;">
        </div>

        <div class="field full" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Correo Institucional (@inacapmail.cl)</label>
          <input type="email" name="email" required placeholder="nombre@inacapmail.cl" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff;">
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Gamertag</label>
          <input type="text" name="gamertag" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff;">
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Carrera INACAP Sede Maipú</label>
          <select name="id_carrera" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff;">
            <option value="" disabled selected>Selecciona carrera</option>
            {% for c in carreras %}
              <option value="{{ c.id_carrera }}">{{ c.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field full" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Contraseña</label>
          <input type="password" name="password" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff;">
        </div>

        <div class="field full">
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; background: #6366f1; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Crear cuenta</button>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
