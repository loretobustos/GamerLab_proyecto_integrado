{% extends 'base.html' %}
{% block content %}
<main style="padding: 40px 20px;">
  <div class="container" style="max-width:560px; margin: 0 auto;">
    <div class="card" style="background: rgba(22, 27, 34, 0.9); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: #fff;">
      <h2 style="margin-bottom: 10px; color: #818cf8;">Registro Institucional</h2>
      <p style="color: #94a3b8; margin-bottom: 20px; font-size: 14px;">Crea tu cuenta, rol y perfil ELO para GamerLab · INACAP Sede Maipú.</p>
      
      {% if error %}
        <div style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px;">
          {{ error }}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'registro' %}" class="form-grid">
        {% csrf_token %}
        
        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Usuario</label>
          <input type="text" name="username" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff; box-sizing: border-box;">
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">RUN / RUT</label>
          <input type="text" name="run_identificador" id="rut_input" placeholder="12.345.678-5" maxlength="15" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff; box-sizing: border-box;">

        </div>

        <div class="field full" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Correo Institucional (@inacapmail.cl)</label>
          <input type="email" name="email" placeholder="nombre@inacapmail.cl" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff; box-sizing: border-box;">
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Carrera</label>
          <select name="id_carrera" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff; box-sizing: border-box;">
            <option value="">Selecciona tu carrera...</option>
            {% for carrera in carreras %}
              <option value="{{ carrera.id }}">{{ carrera.nombre }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="field" style="margin-bottom: 15px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Rol Institucional</label>
          <select name="rol" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff; box-sizing: border-box;">
            <option value="Jugador" selected>Jugador</option>
            <option value="Administrador">Administrador</option>
            <option value="DAE">DAE</option>
          </select>
        </div>

        <div class="field" style="margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 5px; font-weight: 500;">Contraseña</label>
          <input type="password" name="password" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #0d1117; color: #fff; box-sizing: border-box;">
        </div>

        <button type="submit" style="width: 100%; padding: 12px; border-radius: 6px; border: none; background: #6366f1; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer;">
          Crear Cuenta
        </button>
      </form>
    </div>
  </div>
</main>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const rutInput = document.getElementById('rut_input');
    if (rutInput) {
      rutInput.addEventListener('input', function(e) {
        let valor = e.target.value.replace(/[^0-9kK]/g, '').toUpperCase();
        if (valor.length > 1) {
          let cuerpo = valor.slice(0, -1);
          let dv = valor.slice(-1);
          cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          e.target.value = cuerpo + '-' + dv;
        } else {
          e.target.value = valor;
        }
      });
    }
  });
</script>
{% endblock %}
