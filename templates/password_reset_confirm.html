{% extends 'base.html' %}
{% block content %}
<main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 160px); padding: 40px 20px;">
  <div class="container" style="max-width: 480px; width: 100%;">
    <div class="card" style="background: rgba(22, 27, 34, 0.9); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: #fff;">
      <h2 style="margin-bottom: 8px; font-size: 26px; color: #818cf8;">Nueva Contraseña</h2>
      <p style="color: #9aa6b8; margin-bottom: 20px; font-size: 14px;">Ingresa y confirma tu nueva contraseña institucional.</p>
      
      <form method="POST" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="field full" style="margin-top: 15px;">
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; background: #10b981; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Guardar nueva contraseña</button>
        </div>
      </form>
    </div>
  </div>
</main>
{% endblock %}
